<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error ::ERROR_CODE:: | Oops!</title>
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #ff00ff;
            --bg: #0a0a12;
            --text: #e0e0e0;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem 4rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            max-width: 90vw;
            pointer-events: none;
        }
        .container * {
            pointer-events: auto;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.3));
            line-height: 1;
        }
        h2 {
            font-size: 2rem;
            font-weight: 400;
            margin: 10px 0 20px;
            color: #fff;
        }
        p.joke {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }
        .cf-info {
            display: inline-block;
            text-align: left;
            background: rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            border-radius: 12px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #00ffcc;
            border: 1px dashed rgba(0, 255, 204, 0.3);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            min-width: 300px;
        }
        .cf-info::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.1), transparent);
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            100% { left: 200%; }
        }
        .cf-info .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .cf-info .info-row:last-child {
            margin-bottom: 0;
        }
        .cf-info .val {
            color: #fff;
            margin-left: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: #fff;
            text-decoration: none;
            border: 2px solid var(--primary);
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }
        .btn:hover {
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }
        .btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #666;
            letter-spacing: 1px;
        }
        .signature {
            color: var(--secondary);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
        }
        .signature:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary);
            transform: scale(1.1);
        }
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }
        .glitch-wrapper:hover h1 {
            animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            cursor: crosshair;
        }
        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    
    <div class="container" id="card">
        <div class="glitch-wrapper">
            <h1 id="error-code">::ERROR_CODE::</h1>
        </div>
        <h2 id="page-title">Connection Interrupted</h2>
        
        <p class="joke" id="joke-text"></p>
        
        <div class="cf-info">
            <div class="info-row">
                <span id="label_ray">Ray ID:</span> 
                <span class="val">::RAY_ID::</span>
            </div>
            <div class="info-row">
                <span id="label_ip">Your IP:</span> 
                <span class="val">::CLIENT_IP::</span>
            </div>
            <div class="info-row">
                <span id="label_geo">Location:</span> 
                <span class="val">::GEO::</span>
            </div>
            <div class="info-row">
                <span id="label_status">Status:</span> 
                <span class="val">::ERROR_MESSAGE::</span>
            </div>
        </div>
        <br>
        <div>
            <a href="javascript:location.reload();" class="btn" id="refresh-btn">Beam Me Up, Scotty!</a>
        </div>
        
        <div class="footer">
            <span id="label_footer">Designed with <span style="color:#ff3366">❤️</span> & caffeine by</span> <a href="https://github.com/netlops" target="_blank" class="signature" style="text-decoration: none;">NetLops</a>
        </div>
    </div>

    <script>
        // --- i18n & Error Type Logic ---
        const i18n = {
            en: {
                title_default: "Connection Interrupted",
                title_waf: "WAF Blocked",
                title_challenge: "Interactive Challenge",
                title_ratelimit: "Rate Limited",
                label_ray: "Ray ID:",
                label_ip: "Your IP:",
                label_geo: "Location:",
                label_status: "Status:",
                btn_refresh: "Beam Me Up, Scotty!",
                footer_html: `Designed with <span style="color:#ff3366">❤️</span> & caffeine by`,
                jokes: [
                    "Our hamsters powering the server just went on strike. 🐹 Don't panic, we're negotiating with sunflower seeds.",
                    "A wild alien spaceship abducted our server. 🛸 We've dispatched Will Smith to get it back.",
                    "You've ventured into the deep void of the internet. 🌌 Watch out for the digital black holes!",
                    "Oops, looks like someone spilled coffee on the motherboard again. ☕ Sparks are flying!",
                    "The matrix has a glitch. 🐈‍⬛ Déjà vu? Try refreshing the page.",
                    "We fired the developer who caused this. Just kidding, we're just making them fix it while they cry. 😭",
                    "This page is playing hide and seek. 🙈 And it's winning."
                ]
            },
            zh: {
                title_default: "艾玛，连接断了",
                title_waf: "被防火墙大爷拦住了 (WAF)",
                title_challenge: "人机验证挑战",
                title_ratelimit: "你点太快啦，歇会儿",
                label_ray: "请求溯源 (Ray ID):",
                label_ip: "你的门牌号 (IP):",
                label_geo: "你的地界 (Location):",
                label_status: "当前状态 (Status):",
                btn_refresh: "赶紧滴，重新加载！",
                footer_html: `用 <span style="color:#ff3366">❤️</span> 和枸杞水打造，署名`,
                jokes: [
                    "俺们村的服务器被外星人拐跑了。🛸 别慌，全村正抄家伙去追呢。",
                    "机房的仓鼠大爷罢工啦！🐹 我们正拿上好的葵花籽在哄着呢。",
                    "这波啊，这波是网络大爆炸！🌌 小心别掉进代码黑洞里了。",
                    "哎呀妈呀，哪个倒霉蛋又把咖啡撒主板上了？☕ 滋滋冒火星子！",
                    "程序员老哥正在疯狂砸键盘。😭 稍安勿躁，他一边哭一边修呢。",
                    "这页面搁这儿跟你躲猫猫呢。🙈 显然它赢了。",
                    "网络线路大概率是被王大爷的拖拉机压断了。🚜 正在紧急抢修！"
                ]
            }
        };

        const userLang = navigator.language || navigator.userLanguage;
        const lang = userLang.toLowerCase().includes('zh') ? 'zh' : 'en';
        const t = i18n[lang];

        document.getElementById('label_ray').innerText = t.label_ray;
        document.getElementById('label_ip').innerText = t.label_ip;
        document.getElementById('label_geo').innerText = t.label_geo;
        document.getElementById('label_status').innerText = t.label_status;
        document.getElementById('refresh-btn').innerText = t.btn_refresh;
        document.getElementById('label_footer').innerHTML = t.footer_html;
        document.getElementById('joke-text').innerText = t.jokes[Math.floor(Math.random() * t.jokes.length)];

        // Local Preview Mocking (so it doesn't look broken when viewed locally without CF)
        document.querySelectorAll('.cf-info .val').forEach(el => {
            if(el.innerText.includes('::')) {
                const token = el.innerText;
                if(token === '::RAY_ID::') el.innerText = '7x8y9z0a1b2c3d4e';
                if(token === '::CLIENT_IP::') el.innerText = '127.0.0.1';
                if(token === '::GEO::') el.innerText = 'Earth, Milky Way';
                if(token === '::ERROR_MESSAGE::') el.innerText = 'Unknown Anomaly';
            }
        });
        const h1 = document.getElementById('error-code');
        let codeStr = h1.innerText;
        if(codeStr === '::ERROR_CODE::') {
            // Randomly mock a code for local viewing
            const mockCodes = ['403', '429', '500', '502', '1020'];
            codeStr = mockCodes[Math.floor(Math.random() * mockCodes.length)];
            h1.innerText = codeStr;
        }

        // Determine Page Type based on ERROR_CODE or ERROR_MESSAGE
        let titleText = t.title_default;
        const errMsg = document.querySelectorAll('.cf-info .val')[3].innerText.toLowerCase();
        
        if (codeStr === '403' || errMsg.includes('waf') || errMsg.includes('block')) {
            titleText = t.title_waf;
        } else if (codeStr === '429' || errMsg.includes('rate limit')) {
            titleText = t.title_ratelimit;
        } else if (errMsg.includes('challenge') || errMsg.includes('attack mode')) {
            titleText = t.title_challenge;
        }
        document.getElementById('page-title').innerText = titleText;

        // --- 3D Tilt Effect on Card ---
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // --- Interactive Particle Network Background ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
                this.baseX = this.x;
                this.baseY = this.y;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                // Interactive repulse
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (mouse.x != null && distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const maxDistance = mouse.radius;
                    const force = (maxDistance - distance) / maxDistance;
                    const directionX = forceDirectionX * force * 5;
                    const directionY = forceDirectionY * force * 5;
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx/20;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy/20;
                    }
                }

                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 10000;
            if (numberOfParticles > 150) numberOfParticles = 150;
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                let color = Math.random() > 0.5 ? '#00ffcc' : '#ff00ff';
                
                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                    + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = `rgba(100, 200, 255, ${opacityValue * 0.2})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        window.addEventListener('resize', function() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
